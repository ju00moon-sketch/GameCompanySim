<style>
:root{
  --bg:#eef0ee; --panel:#f9faf8; --ink:#1c2230; --ink-2:#4a5263; --ink-3:#7b8395;
  --line:#d6dad4; --brass:#9c7630; --brass-soft:#e9dcc0;
  --done:#2f7d5c; --done-bg:#dcefe5; --active:#2f5f9e; --active-bg:#dde7f5;
  --wait:#8a8f99; --wait-bg:#e7e9ec; --decide:#b1452f; --decide-bg:#f6e0d9;
  --review:#7a4fa0; --review-bg:#ebe1f3; --blocked:#9e2f2f; --blocked-bg:#f3dcdc;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#141821; --panel:#1b2130; --ink:#e7e9ee; --ink-2:#b4bac7; --ink-3:#848b9b;
    --line:#2c3446; --brass:#d2ab5e; --brass-soft:#3a3223;
    --done:#63c49a; --done-bg:#1d3a2f; --active:#7fa8e6; --active-bg:#1e2d47;
    --wait:#9aa0ab; --wait-bg:#262c38; --decide:#ec8a72; --decide-bg:#43261f;
    --review:#bb96e0; --review-bg:#34274a; --blocked:#e07a7a; --blocked-bg:#44242a; }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:28px}
header.top{display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .asof{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4.4vw,36px);line-height:1.25;margin:0;display:flex;gap:12px;align-items:center}
h1 svg{flex:none;width:34px;height:34px}
.goalline{font-size:14px;color:var(--ink-2);max-width:72ch;margin:0}
.goalline b{color:var(--ink)}
h2{font-family:var(--serif);font-size:20px;margin:0 0 12px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.7}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-done{color:var(--done);background:var(--done-bg)} .s-active{color:var(--active);background:var(--active-bg)}
.s-wait{color:var(--wait);background:var(--wait-bg)} .s-decide{color:var(--decide);background:var(--decide-bg)}
.s-review{color:var(--review);background:var(--review-bg)} .s-blocked{color:var(--blocked);background:var(--blocked-bg)}
.work{columns:280px;column-gap:12px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0;break-inside:avoid;margin:0 0 12px}
.wk h3{margin:0}
.wk-sum{margin:0;font-size:13px;color:var(--ink-2)}
.wk-loose{margin-top:12px}
.wk-loose h3,.ms-h{font-family:var(--serif);font-size:16px;margin:0 0 6px}
.ms-h{margin-top:16px}
.step-t small.src{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:2px}
ol.steps{list-style:none;margin:0;padding:0;display:grid}
ol.steps li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;border:2px solid var(--wait);background:transparent}
.d-done{background:var(--done);border-color:var(--done)} .d-active{background:var(--active-bg);border-color:var(--active)}
.d-review{background:var(--review-bg);border-color:var(--review)} .d-decide{background:var(--decide-bg);border-color:var(--decide)}
.d-blocked{background:var(--blocked-bg);border-color:var(--blocked)}
.step-t{font-size:14px;line-height:1.5}
.step-t small{display:block;font-size:12px;color:var(--ink-3);line-height:1.45}
.mono{font-family:var(--mono);font-size:12px}
.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.role{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.role-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.role-n{font-weight:700;font-size:14px}
.role-m{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.role p{margin:0;font-size:13px;color:var(--ink-2)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fabnote,.readme{font-size:13px;color:var(--ink-2);margin:0 0 12px;max-width:80ch}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:start}
.chain li:first-child{border-top:0}
.chain .n{font-family:var(--mono);color:var(--brass);font-size:12px;padding-top:2px}
.chain .g{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;padding-top:3px}
.chain small{display:block;color:var(--ink-3);font-size:12px}
.wait4{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.wcat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.wcat h3{font-size:14px;margin:0 0 4px;color:var(--brass)}
.wcat .wdesc{font-size:12px;color:var(--ink-3);margin:0 0 6px}
.witem{display:grid;gap:5px;font-size:13px;padding:9px 0;border-top:1px solid var(--line)}
.witem .wt{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;line-height:1.4}
.witem dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.witem dt{color:var(--ink-3);white-space:nowrap;font-size:12px;padding-top:1px}
#decisions{grid-column:1/-1}
.witem .wt>.chip{flex:0 0 auto}
.review-sources{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.review-sources li{min-width:0}
.review-sources a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink-2)}
.review-sources a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.witem .decision-review{grid-template-columns:9em minmax(0,1fr);row-gap:8px;margin-top:6px}
.witem .decision-review dt{white-space:normal;color:var(--ink-2);font-weight:500}
@media (max-width:480px){.witem .decision-review{grid-template-columns:minmax(0,1fr);row-gap:3px}.decision-review dd{margin-bottom:8px}}
.readbtn{margin-left:auto;font:inherit;font-size:11px;font-weight:500;color:var(--ink-3);background:transparent;border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
.readbtn:hover{color:var(--ink);border-color:var(--ink-3)} .readbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.is-read .readbtn{color:var(--ink);border-color:var(--ink-3);background:var(--brass-soft)}
.tl li.is-read,[data-pane="closed"] .is-read{opacity:.55} .is-read .tt{font-weight:400}
.witem:not(.is-read) .wt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brass);flex:0 0 auto}
.tabs{display:flex;gap:6px;margin:8px 0 2px;flex-wrap:wrap}
.tab{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:none;display:inline-block}
a.tab:hover{color:var(--ink);border-color:var(--ink-3)} .eyebrow a{color:var(--ink-2)}
.tab.is-on{background:var(--ink);color:var(--panel);border-color:var(--ink)} .tab-util{margin-left:auto;color:var(--ink-3)}
.unread-badge{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px;font-weight:400} .unread-badge.has{color:var(--brass)}
.tl li .tt{display:flex;gap:8px;align-items:flex-start} .tl li .readbtn{flex:0 0 auto}
.witem dd{margin:0;color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.tl li:first-child{border-top:0}
.tl time{font-family:var(--mono);font-size:12px;color:var(--brass);padding-top:1px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:6px}
.shots figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.shots img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;background:#111}
.shots figcaption{font-size:12.5px;color:var(--ink);padding:8px 10px;border-top:1px solid var(--line)}
.shots figcaption small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
.shots-h{font-size:13px;color:var(--ink-2);margin:10px 0 6px;font-weight:500}
.wwhy{font-size:13px;color:var(--ink-2);margin:6px 0 4px;line-height:1.55;max-width:80ch}
.wrefs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.wref{margin:0;width:200px} .wref img{display:block;width:100%;border:1px solid var(--line);border-radius:6px;background:#111}
.wref figcaption{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.page-tabs .tab{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;font-size:14px}
.page-tabs .tab:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.gallery-page h1{flex-wrap:wrap}
.gallery-page .shots{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.gallery-page .shots figure{background:var(--panel)}
.gallery-page .shots figcaption small,.gallery-page footer{color:var(--ink-2)}
.art-page .shots img{aspect-ratio:auto;height:auto;object-fit:contain}
.witem .wans{margin:0;padding:6px 10px;border-left:3px solid var(--done);background:var(--done-bg);color:var(--ink);font-size:13px;line-height:1.55;border-radius:0 6px 6px 0}
.witem .wans b{margin-right:6px}
.gallery-page .shots.pairs{grid-template-columns:repeat(2,minmax(0,1fr))}
.ab-lead{margin:0 0 8px;font-size:13px;color:var(--ink-2);max-width:80ch}
.ab-table{border-collapse:collapse;margin:0 0 12px;font-size:13px;font-variant-numeric:tabular-nums;word-break:keep-all}
.ab-table th,.ab-table td{padding:6px 12px;border-top:1px solid var(--line);text-align:right}
.ab-table thead th{border-top:0;color:var(--ink);font-weight:700}
.ab-table thead th:first-child{text-align:left}
.ab-table th[scope="row"]{text-align:left;font-weight:500;color:var(--ink-2)}
.ctable{display:grid;gap:6px;margin-top:6px}
.ctable-lead{margin:0;font-size:13px;color:var(--ink)}
.ctable-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ctable-scroll:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ctable table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px;line-height:1.5;word-break:keep-all}
.ctable caption{text-align:left;padding:8px 10px;font-weight:700;color:var(--ink)}
.ctable th,.ctable td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.ctable td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ctable thead th{font-size:12px;font-weight:600;color:var(--ink-2)}
.ctable tbody th,.ctable tfoot th{white-space:nowrap}
.ctable tfoot th,.ctable tfoot td{background:var(--brass-soft)}
.ctable-notes{margin:0;padding-left:18px;font-size:12px;color:var(--ink-2)}
@media (max-width:999px){
  .ctable-scroll{overflow:visible;border:0}
  .ctable table,.ctable caption,.ctable tbody,.ctable tfoot,.ctable tr,.ctable th,.ctable td{display:block}
  .ctable table{min-width:0}
  .ctable caption{padding:0}
  .ctable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .ctable tr{border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:6px 0}
  .ctable th,.ctable td{border-top:0;padding:3px 12px}
  .ctable td::before{content:attr(data-label);display:block;font-size:11px;color:var(--ink-3)}
}
.shots-more{margin-top:14px} .shots-more summary{cursor:pointer;font-size:13px;color:var(--ink-2)} .shots-more .shots{margin-top:10px}
details.raw summary{cursor:pointer;font-family:var(--serif);font-size:16px;color:var(--ink-2)}
.doc{font-size:13.5px;color:var(--ink-2);margin-top:12px}
.doc h2{font-size:16px;margin:18px 0 8px} .doc p{margin:8px 0} .doc ul{padding-left:20px}
.doc table{display:block;overflow-x:auto;border-collapse:collapse;font-size:12.5px}
.doc th,.doc td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.doc code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 4px;border-radius:3px}
footer{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:420px){ .tl li{grid-template-columns:52px 1fr} }
body{overflow-wrap:anywhere}
.wrap,.wrap>*,.witem,.witem>*,.witem dd,.witem .wt,.wwhy,.tl li>*,.tl li .tt,.chain li>*,.wcat,.box{min-width:0}
.witem .wt>span,.witem .wt>b{min-width:0;flex:1 1 auto}
.doc pre,.doc code{white-space:pre-wrap}
@media (max-width:480px){ .wait4{grid-template-columns:1fr} .wref{width:100%} }
</style>
</head>
